
name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/droplink-release.jks"
            {
              echo "DROPLINK_KEYSTORE_PATH=$RUNNER_TEMP/droplink-release.jks"
              echo "DROPLINK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "DROPLINK_KEY_ALIAS=$KEY_ALIAS"
              echo "DROPLINK_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not set, building a DEBUG APK instead of a signed release APK."
          fi

      - name: GMS ban check and unit tests
        run: ./gradlew --stacktrace verifyNoGoogleServices testDebugUnitTest

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        run: ./gradlew --stacktrace assembleRelease

      - name: Build debug APK (no signing secrets)
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew --stacktrace assembleDebug

      - name: Collect APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mkdir -p dist

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            label="$GITHUB_REF_NAME"
          else
            label="${GITHUB_SHA::7}"
          fi

          if [ "$SIGNED" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk \
              "dist/DropLink-${label}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk \
              "dist/DropLink-${label}-debug.apk"
          fi

          (
            cd dist
            sha256sum *.apk > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropLink-apk
          path: dist/
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
